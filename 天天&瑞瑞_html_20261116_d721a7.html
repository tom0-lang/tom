<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>天天与瑞瑞 · 第一章 一把伞的距离</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  margin:0;height:100%;background:#0b0e13;overflow:hidden;
  font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",serif;
  user-select:none;
}
#stage{
  position:absolute;left:50%;top:50%;width:1600px;height:900px;
  transform-origin:center center;overflow:hidden;background:#1a2028;
  cursor:pointer;
}

/* ============ 背景 ============ */
#bgSvg{position:absolute;inset:0;width:100%;height:100%;display:block;}
#rainLayer{animation:rainFall .85s linear infinite;}
@keyframes rainFall{
  0%{transform:translate(0px,-420px);}
  100%{transform:translate(-110px,420px);}
}
#vignette{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0) 38%,rgba(8,12,18,.52) 100%);
}
#mist{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(180,205,220,.16) 0%,rgba(180,205,220,0) 40%,rgba(150,165,175,.10) 100%);
  mix-blend-mode:screen;
}

/* ============ 角色 ============ */
.char{
  position:absolute;bottom:0;width:420px;height:880px;
  transition:opacity .5s ease,transform .5s ease,filter .4s ease;
  will-change:opacity,transform;
}
#tian{left:905px;}
#rui{left:250px;}
.char.hidden{opacity:0;transform:translateY(30px);}
.char.dim{filter:brightness(.78) saturate(.88);}
.char svg{
  width:100%;height:100%;display:block;overflow:visible;
  transform-origin:50% 100%;
  animation:breathe 4.8s ease-in-out infinite;
}
#rui svg{animation-duration:5.5s;animation-delay:-1.4s;}
@keyframes breathe{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-5px);}
}

/* 眨眼 */
.eye-open{opacity:1;transition:opacity .07s linear;}
.eye-closed{opacity:0;transition:opacity .07s linear;}
.blink .eye-open{opacity:0;}
.blink .eye-closed{opacity:1;}

/* ============ 对话框 ============ */
#dialogue{
  position:absolute;left:100px;right:100px;bottom:34px;height:212px;
  background:linear-gradient(180deg,rgba(250,245,236,.965),rgba(238,229,212,.965));
  border-radius:14px;
  border:1px solid rgba(178,146,104,.75);
  box-shadow:0 14px 46px rgba(0,0,0,.42),inset 0 0 0 5px rgba(255,255,255,.4);
  padding:30px 52px 26px;
  opacity:0;transform:translateY(18px);
  transition:opacity .4s ease,transform .4s ease;
  pointer-events:none;
}
#dialogue.show{opacity:1;transform:translateY(0);}
#dialogue::before,#dialogue::after{
  content:"";position:absolute;width:22px;height:22px;
  border:2px solid rgba(178,146,104,.55);
}
#dialogue::before{left:12px;top:12px;border-right:0;border-bottom:0;border-radius:4px 0 0 0;}
#dialogue::after{right:12px;bottom:12px;border-left:0;border-top:0;border-radius:0 0 4px 0;}

#name{
  position:absolute;left:44px;top:-24px;
  background:linear-gradient(180deg,#c9583f,#a83f2c);
  color:#fdf6ea;padding:5px 26px 6px;border-radius:9px;
  font-size:25px;letter-spacing:4px;
  box-shadow:0 4px 12px rgba(140,50,30,.4);
  transition:opacity .25s;
}
#name.empty{opacity:0;}
#text{
  font-size:29px;line-height:1.78;color:#2c2a2f;letter-spacing:1.5px;
  height:155px;overflow:hidden;
  text-shadow:0 1px 0 rgba(255,255,255,.6);
}
#hint{
  position:absolute;right:46px;bottom:16px;font-size:20px;color:#9a7b56;
  letter-spacing:2px;opacity:0;transition:opacity .3s;
  animation:blinkHint 1.5s ease-in-out infinite;
}
#hint.on{opacity:.9;}
@keyframes blinkHint{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}

/* ============ 选项 ============ */
#choice{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:26px;
  background:rgba(12,16,22,.55);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .35s;
}
#choice.show{opacity:1;pointer-events:auto;}
#choiceTitle{
  font-size:30px;color:#f6ecd9;letter-spacing:8px;
  text-shadow:0 3px 14px rgba(0,0,0,.7);
}
#choiceRow{display:flex;gap:36px;}
.opt{
  width:250px;padding:26px 18px 22px;border-radius:16px;
  background:linear-gradient(180deg,rgba(250,245,235,.97),rgba(235,226,208,.97));
  border:1px solid rgba(178,146,104,.8);
  box-shadow:0 12px 34px rgba(0,0,0,.45);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:12px;
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s;
  font-family:inherit;
}
.opt:hover{transform:translateY(-8px) scale(1.03);box-shadow:0 20px 44px rgba(0,0,0,.55);border-color:#c9583f;}
.opt:active{transform:translateY(-2px) scale(.99);}
.opt svg{width:132px;height:150px;}
.opt .nm{font-size:24px;color:#42322a;letter-spacing:3px;}
.opt .ds{font-size:16px;color:#8b7460;letter-spacing:1px;}

/* ============ 标题界面 ============ */
#title{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;
  background:radial-gradient(ellipse at 50% 45%,rgba(20,28,38,.72),rgba(8,11,16,.94));
  transition:opacity .7s ease;z-index:20;
}
#title.hide{opacity:0;pointer-events:none;}
#title h1{
  font-size:76px;margin:0;color:#f7efdf;letter-spacing:16px;font-weight:400;
  text-shadow:0 6px 30px rgba(0,0,0,.85),0 0 60px rgba(200,120,90,.35);
}
#title .sub{font-size:23px;color:#c9b79b;letter-spacing:7px;}
#title .ch{font-size:27px;color:#e8b48c;letter-spacing:10px;margin-top:6px;}
#startBtn{
  margin-top:26px;padding:16px 66px;font-size:25px;letter-spacing:9px;
  color:#fbf3e3;background:linear-gradient(180deg,rgba(190,90,66,.92),rgba(150,62,44,.92));
  border:1px solid rgba(240,200,160,.55);border-radius:10px;cursor:pointer;
  font-family:inherit;box-shadow:0 10px 30px rgba(0,0,0,.5);
  transition:transform .2s,box-shadow .2s,filter .2s;
}
#startBtn:hover{transform:translateY(-3px);filter:brightness(1.1);box-shadow:0 16px 40px rgba(0,0,0,.6);}
#title .tip{position:absolute;bottom:36px;font-size:17px;color:#7d8a97;letter-spacing:3px;}

/* ============ 音频按钮 ============ */
#audioBtn{
  position:absolute;right:26px;top:22px;z-index:15;
  width:54px;height:54px;border-radius:50%;cursor:pointer;
  background:rgba(20,26,34,.5);border:1px solid rgba(220,190,150,.35);
  color:#e8d9c2;font-size:24px;display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .2s;font-family:inherit;
}
#audioBtn:hover{background:rgba(30,38,48,.75);transform:scale(1.06);}

/* ============ 结束 ============ */
#ending{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:30px;
  background:rgba(6,9,13,.86);opacity:0;pointer-events:none;
  transition:opacity .9s ease;z-index:19;
}
#ending.show{opacity:1;pointer-events:auto;}
#ending h2{font-size:52px;color:#f6ecda;letter-spacing:14px;font-weight:400;margin:0;}
#ending p{font-size:22px;color:#a99a86;letter-spacing:4px;margin:0;line-height:2;}
#ending button{
  margin-top:10px;padding:13px 48px;font-size:22px;letter-spacing:6px;
  color:#fbf3e3;background:rgba(150,62,44,.85);border:1px solid rgba(240,200,160,.5);
  border-radius:9px;cursor:pointer;font-family:inherit;transition:filter .2s;
}
#ending button:hover{filter:brightness(1.15);}
</style>
</head>

<div id="stage">

/* ================= 舞台自适应 ================= */

  stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
window.addEventListener('resize', resize);
resize();

/* ================= 雨丝生成 ================= */
var NS = 'http://www.w3.org/2000/svg';
var rainLayer = document.getElementById('rainLayer');
for(var i=0;i<90;i++){
  var x = Math.random()*1900 - 150;
  var y = Math.random()*1600 - 500;
  var len = 26 + Math.random()*48;
  var l = document.createElementNS(NS,'line');
  l.setAttribute('x1', x);
  l.setAttribute('y1', y);
  l.setAttribute('x2', x - len*0.36);
  l.setAttribute('y2', y + len);
  l.setAttribute('stroke', '#e9f3f9');
  l.setAttribute('stroke-width', (0.9 + Math.random()*1.1).toFixed(2));
  l.setAttribute('opacity', (0.10 + Math.random()*0.28).toFixed(2));
  l.setAttribute('stroke-linecap','round');
  rainLayer.appendChild(l);
}

/* ================= 音效 ================= */
var actx = null, rainGain = null, masterOn = true;
function initAudio(){
  if(actx) return;
  try{
    actx = new (window.AudioContext || window.webkitAudioContext)();
  }catch(e){ return; }

  // 雨声
  var bufSize = actx.sampleRate * 2;
  var buf = actx.createBuffer(1, bufSize, actx.sampleRate);
  var d = buf.getChannelData(0);
  for(var i=0;i<bufSize;i++) d[i] = Math.random()*2 - 1;
  var src = actx.createBufferSource();
  src.buffer = buf; src.loop = true;

  var lp = actx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 1500; lp.Q.value = 0.6;

  var hp = actx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 260;

  rainGain = actx.createGain();
  rainGain.gain.value = 0.05;

  src.connect(lp); lp.connect(hp); hp.connect(rainGain);
  rainGain.connect(actx.destination);
  src.start();
}
function sfxClick(){
  if(!actx || !masterOn) return;
  var t = actx.currentTime;
  var o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(760, t);
  o.frequency.exponentialRampToValueAtTime(360, t + 0.09);
  g.gain.setValueAtTime(0.055, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + 0.16);
}
function sfxPick(){
  if(!actx || !masterOn) return;
  var t = actx.currentTime;
  var o = actx.createOscillator(), g = actx.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(520, t);
  o.frequency.exponentialRampToValueAtTime(900, t + 0.12);
  g.gain.setValueAtTime(0.07, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + 0.32);
}

      loop();
    }, base + Math.random()*2600);
  }
  loop();
}

/* ================= 状态 ================= */
var state = { i:-1, typing:false, paused:false, ended:false };

var elTianBox = document.getElementById('tian');
var elRuiBox  = document.getElementById('rui');
var elName    = document.getElementById('name');
var elText    = document.getElementById('text');
var elHint    = document.getElementById('hint');
var elDlg     = document.getElementById('dialogue');
var elChoice  = document.getElementById('choice');
var elChoiceRow = document.getElementById('choiceRow');
var elChoiceTitle = document.getElementById('choiceTitle');
var elEnding  = document.getElementById('ending');

var typeTimer = null;
var fullText = '';

/* ================= 打字机 ================= */
function typeText(str){
  clearInterval(typeTimer);
  fullText = str;
  state.typing = true;
  elHint.classList.remove('on');
  var i = 0;
  elText.textContent = '';
  typeTimer = setInterval(function(){
    i++;
    elText.textContent = str.slice(0, i);
    if(i >= str.length){
      clearInterval(typeTimer);
      state.typing = false;
      elHint.classList.add('on');
    }
  }, 38);
}
function finishTyping(){
  clearInterval(typeTimer);
  elText.textContent = fullText;
  state.typing = false;
  elHint.classList.add('on');
}

/* ================= 立绘更新 ================= */
function updateStage(show){
  var list = show || [];
  var hasT = list.indexOf('tian') >= 0;
  var hasR = list.indexOf('rui') >= 0;
  elTianBox.classList.toggle('hidden', !hasT);
  elRuiBox.classList.toggle('hidden', !hasR);
}
function updateDim(name){
  elTianBox.classList.remove('dim');
  elRuiBox.classList.remove('dim');
  if(name === '天天' && !elRuiBox.classList.contains('hidden')){
    elRuiBox.classList.add('dim');
  } else if(name === '瑞瑞' && !elTianBox.classList.contains('hidden')){
    elTianBox.classList.add('dim');
  }
}

/* ================= 播放一句 ================= */
var curShow = ['tian'];

function playLine(line){
  // 选项节点
  if(line.type === 'choice'){
    showChoice();
    return;
  }

  elDlg.classList.add('show');

  if(line.show){
    if(line.show.join(',') !== curShow.join(',')){
      curShow = line.show.slice();
      updateStage(curShow);
    }
  }

  if(line.name){
    elName.textContent = line.name;
    elName.classList.remove('empty');
  } else {
    elName.classList.add('empty');
  }
  updateDim(line.name);

  typeText(line.text);
}

/* ================= 推进 ================= */
function next(){
  if(state.paused || state.ended) return;
  if(state.typing){ finishTyping(); return; }

  state.i++;
  if(state.i >= SCRIPT.length){ endGame(); return; }

  sfxClick();
  playLine(SCRIPT[state.i]);
}

/* ================= 选项 ================= */
function showChoice(){
  state.paused = true;
  elHint.classList.remove('on');
  elChoiceTitle.textContent = CHOICE_DATA.prompt;
  elChoiceRow.innerHTML = '';

  CHOICE_DATA.options.forEach(function(opt, idx){
    var btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = opt.svg +
      '<div class="nm">' + opt.label + '</div>' +
      '<div class="ds">' + opt.desc + '</div>';
    btn.addEventListener('click', function(ev){
      ev.stopPropagation();
      pickChoice(idx);
    });
    elChoiceRow.appendChild(btn);
  });

  elChoice.classList.add('show');
}

function pickChoice(idx){
  sfxPick();
  elChoice.classList.remove('show');
  state.paused = false;

  var res = CHOICE_DATA.options[idx].result;
  var insert = [];
  for(var i=0;i<res.length;i++) insert.push(res[i]);
  insert.unshift({ type:'splice' }); // 占位，无实际用途
  insert.shift();

  // 将结果插入到当前位置之后
  Array.prototype.splice.apply(SCRIPT, [state.i+1, 0].concat(insert));

  // 让下一句自然衔接
  state.i++;
  playLine(SCRIPT[state.i]);
}

/* ================= 结束 ================= */
function endGame(){
  state.ended = true;
  elDlg.classList.remove('show');
  elHint.classList.remove('on');
  setTimeout(function(){
    elEnding.classList.add('show');
  }, 700);
}

/* ================= 点击推进 ================= */
stage.addEventListener('click', function(){
  if(document.getElementById('title').classList.contains('hide') === false) return;
  if(state.paused || state.ended) return;
  next();
});

/* ================= 开始 ================= */
document.getElementById('startBtn').addEventListener('click', function(ev){
  ev.stopPropagation();
  initAudio();
  sfxClick();
  document.getElementById('title').classList.add('hide');
  curShow = [];
  updateStage(['tian']);
  curShow = ['tian'];
  state.i = -1;
  state.ended = false;
  elDlg.classList.add('show');
  setTimeout(function(){ next(); }, 500);
});

/* ================= 重来 ================= */
document.getElementById('againBtn').addEventListener('click', function(ev){
  ev.stopPropagation();
  location.reload();
});

/* ================= 声音开关 ================= */
var audioBtn = document.getElementById('audioBtn');
audioBtn.addEventListener('click', function(ev){
  ev.stopPropagation();
  initAudio();
  masterOn = !masterOn;
  if(rainGain){
    rainGain.gain.setTargetAtTime(masterOn ? 0.05 : 0, actx.currentTime, 0.1);
  }
  audioBtn.textContent = masterOn ? '♪' : '✕';
  audioBtn.style.opacity = masterOn ? '1' : '.55';
});

/* 键盘 */
window.addEventListener('keydown', function(e){
  if(e.key === ' ' || e.key === 'Enter'){
    if(!state.paused && !state.ended &&
       document.getElementById('title').classList.contains('hide')){
      next();
    }
  }
});

})();
</script>
