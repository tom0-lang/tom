<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>瑞雪遇晴天 · 国风互动小剧场</title>
<style>
:root{
  --ink:#26262e; --paper:#f8efdc; --paper2:#f3e6c8; --red:#c0392b; --red2:#a93226;
  --gold:#c99a3f; --gold2:#e2c179; --teal:#1f4e5f; --dim:#6b5d43;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 30%, #33333f 0%, #17171d 70%)}
body{font-family:"Kaiti SC","STKaiti",KaiTi,"Noto Serif SC","SimSun",serif;user-select:none;-webkit-user-select:none}
#wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1280px;height:720px;flex:none;overflow:hidden;border-radius:14px;
  box-shadow:0 22px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(226,193,121,.25);
  transform-origin:center center;touch-action:none;background:#0d1b20}
#stage.shake{animation:shake .5s ease}
@keyframes shake{0%,100%{transform:var(--s)}20%{transform:var(--s) translate(-7px,2px)}40%{transform:var(--s) translate(6px,-3px)}60%{transform:var(--s) translate(-5px,-2px)}80%{transform:var(--s) translate(4px,2px)}}

/* ---------- 背景 ---------- */
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s ease}
.bg.on{opacity:1}

/* ---------- 雪 ---------- */
#snow{position:absolute;inset:0;pointer-events:none}

/* ---------- 人物 ---------- */
.char{position:absolute;bottom:15%;height:62%;opacity:0;transform:translateY(26px);transition:opacity .55s ease,transform .55s ease;pointer-events:none}
.char.on{opacity:1;transform:translateY(0)}
.char img{height:100%;width:auto;display:block;filter:drop-shadow(0 10px 14px rgba(10,20,30,.35))}
.char.sideL{left:9%}
.char.sideR{left:auto;right:9%}
.char.breathe img{animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.014)}}
.char.talk img{animation:talkBounce .42s ease}
@keyframes talkBounce{0%{transform:translateY(0)}35%{transform:translateY(-9px) scale(1.012)}70%{transform:translateY(0)}85%{transform:translateY(-4px)}100%{transform:translateY(0)}}
.char.dim img{filter:drop-shadow(0 10px 14px rgba(10,20,30,.35)) brightness(.88) saturate(.92)}

/* ---------- 对话框 ---------- */
#dlg{position:absolute;left:4%;right:4%;bottom:26px;min-height:132px;padding:24px 30px 20px;
  background:linear-gradient(180deg, rgba(250,243,224,.96), rgba(243,230,200,.94));
  border:2px solid rgba(201,154,63,.9);border-radius:16px;
  box-shadow:0 10px 26px rgba(0,0,0,.35), inset 0 0 0 4px rgba(226,193,121,.28), inset 0 0 40px rgba(201,154,63,.12);
  transition:opacity .3s ease, transform .3s ease}
#dlg.hidden{opacity:0;transform:translateY(14px);pointer-events:none}
#dlgName{position:absolute;top:-18px;left:26px;background:linear-gradient(180deg,var(--red),var(--red2));color:#fdf3dd;
  padding:5px 18px;border-radius:8px;font-size:21px;letter-spacing:2px;border:1.5px solid var(--gold2);
  box-shadow:0 4px 10px rgba(120,20,10,.35);transform:rotate(-1.6deg)}
#dlgName.hidden{display:none}
#dlgText{font-size:26px;line-height:1.62;color:#3c3323;letter-spacing:.5px;min-height:64px}
#dlgText.nar{color:#6d5f42;font-size:24px}
#dlgNext{position:absolute;right:20px;bottom:10px;color:var(--red);font-size:20px;animation:bob 1s ease-in-out infinite;opacity:.85}
#dlgNext.hidden{display:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

/* ---------- 选择 ---------- */
#choices{position:absolute;left:50%;bottom:200px;transform:translateX(-50%);display:flex;flex-direction:column;gap:12px;z-index:30}
#choices.hidden{display:none}
#choicePrompt{align-self:center;background:rgba(38,38,46,.82);color:#f4e9cf;padding:8px 20px;border-radius:20px;font-size:21px;margin-bottom:4px;border:1px solid rgba(226,193,121,.4)}
.choice{min-width:420px;padding:13px 26px;font-size:23px;color:#4a3d28;cursor:pointer;text-align:center;
  background:linear-gradient(180deg,#faf3dc,#f1e3c0);border:2px solid rgba(201,154,63,.85);border-radius:14px;
  box-shadow:0 6px 16px rgba(0,0,0,.3);transition:transform .18s ease, box-shadow .18s ease;font-family:inherit}
.choice:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 12px 22px rgba(0,0,0,.35);border-color:var(--red)}

/* ---------- HUD ---------- */
#hud{position:absolute;top:14px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;z-index:40;pointer-events:none}
#hud button{pointer-events:auto;cursor:pointer;font-family:inherit}
#hudTitle{background:rgba(20,26,30,.55);color:#e9d9ae;border:1px solid rgba(226,193,121,.5);padding:7px 16px;border-radius:20px;font-size:18px;letter-spacing:3px}
.hud-right{display:flex;gap:10px}
.hudBtn{position:relative;width:46px;height:46px;border-radius:50%;background:linear-gradient(180deg,#faf3dc,#eeddb4);
  border:2px solid var(--gold);font-size:20px;color:#a93226;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.hudBtn .badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:13px;min-width:20px;height:20px;border-radius:10px;line-height:20px;text-align:center;border:1.5px solid #fff}
#btnMute.muted{text-decoration:line-through;opacity:.62}
#hud.hidden,#hud.hidden *{display:none}

/* ---------- 小游戏 ---------- */
#gameLayer{position:absolute;inset:0;z-index:35}
#gameLayer.hidden{display:none}
#gameBanner{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:rgba(38,38,46,.85);color:#f4e9cf;
  padding:10px 24px;border-radius:24px;font-size:22px;letter-spacing:1px;border:1px solid rgba(226,193,121,.45);white-space:nowrap}
#incenseWrap{position:absolute;top:118px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;color:#f4e9cf;font-size:17px}
#incenseBar{width:220px;height:10px;border-radius:5px;background:rgba(0,0,0,.4);border:1px solid rgba(226,193,121,.5);overflow:hidden}
#incenseFill{height:100%;width:100%;background:linear-gradient(90deg,#e2c179,#c0392b);transition:width .3s linear}
#targetZone{position:absolute;left:38%;top:56%;width:30%;height:17%;border:2.5px dashed rgba(226,193,121,.9);border-radius:14px;
  background:rgba(226,193,121,.10);display:flex;align-items:flex-end;justify-content:center;color:rgba(244,233,207,.9);font-size:17px;letter-spacing:4px;padding-bottom:6px}
#targetZone.hot{background:rgba(226,193,121,.22);border-color:#ffe9a8}
.lantern{position:absolute;width:92px;cursor:grab;touch-action:none;filter:drop-shadow(0 8px 10px rgba(10,20,30,.4));z-index:38}
.lantern:active{cursor:grabbing}
.lantern.done{cursor:default}
.lantern svg{display:block;overflow:visible}
.lantern .face{animation:blink 3.6s infinite}
@keyframes blink{0%,92%,100%{opacity:1}95%{opacity:0}}
.lantern.picked{filter:drop-shadow(0 14px 16px rgba(10,20,30,.5))}
.lantern.done{animation:lanternGlow 1.8s ease-in-out infinite}
@keyframes lanternGlow{0%,100%{filter:drop-shadow(0 0 6px rgba(255,190,80,.7))}50%{filter:drop-shadow(0 0 18px rgba(255,190,80,.95))}}
.lantern{animation:sway 3.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(2.4deg)}}

/* ---------- 弹层通用 ---------- */
.overlay{position:absolute;inset:0;background:rgba(10,12,16,.55);display:flex;align-items:center;justify-content:center;z-index:60}
.overlay.hidden{display:none}
#notePaper{width:560px;max-width:88%;background:linear-gradient(175deg,#fbf4df,#f1e3bf);border-radius:6px;padding:34px 38px 26px;
  box-shadow:0 18px 50px rgba(0,0,0,.5);position:relative;transform:rotate(-.8deg)}
#notePaper::before{content:"";position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#ff6b5e,#a93226);box-shadow:0 3px 6px rgba(0,0,0,.4)}
#noteTitle{font-size:25px;color:var(--red2);font-weight:bold;letter-spacing:1px;margin-bottom:14px;text-align:center}
#noteBody{font-size:22px;line-height:1.75;color:#453b28}
#noteBody .quip{display:block;margin-top:14px;padding-top:12px;border-top:1.5px dashed rgba(201,154,63,.6);color:#8a6d2f;font-size:20px}
#noteClose{display:block;margin:22px auto 0;padding:9px 34px;font-size:20px;background:linear-gradient(180deg,var(--red),var(--red2));
  color:#fdf3dd;border:1.5px solid var(--gold2);border-radius:24px;cursor:pointer;font-family:inherit;letter-spacing:2px}
#noteClose:hover{filter:brightness(1.08)}
#listPaper{width:520px;max-width:88%;background:linear-gradient(175deg,#fbf4df,#f1e3bf);border-radius:10px;padding:30px 34px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
#listPaper h3{color:var(--red2);font-size:24px;margin-bottom:16px;letter-spacing:2px;text-align:center}
.listItem{padding:12px 16px;border:1.5px solid rgba(201,154,63,.55);border-radius:10px;margin-bottom:10px;font-size:21px;color:#4a3d28;cursor:pointer;background:rgba(255,252,242,.6)}
.listItem:hover{background:#fff8e6;border-color:var(--red)}
#listEmpty{color:#8a7c5c;font-size:20px;text-align:center;padding:16px 0}
#listClose{display:block;margin:6px auto 0;padding:8px 30px;font-size:19px;background:linear-gradient(180deg,var(--red),var(--red2));color:#fdf3dd;border:1.5px solid var(--gold2);border-radius:22px;cursor:pointer;font-family:inherit}

/* ---------- 标题页 ---------- */
#title{position:absolute;inset:0;z-index:80;background:linear-gradient(180deg,rgba(13,22,28,.68),rgba(13,22,28,.82));display:flex;align-items:center;justify-content:center}
#title.hidden{display:none}
.title-card{text-align:center;color:#f4e9cf}
.title-sub{font-size:22px;letter-spacing:10px;color:#cdb98a;margin-bottom:18px}
.title-main{display:flex;align-items:center;justify-content:center;gap:22px;margin-bottom:14px}
.title-main h1{font-size:78px;letter-spacing:6px;font-weight:bold;color:#f7ecd2;text-shadow:0 4px 18px rgba(0,0,0,.6)}
.seal{width:64px;height:64px;background:linear-gradient(160deg,#d84a3a,#a93226);border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:40px;color:#fdf3dd;transform:rotate(6deg);box-shadow:0 6px 14px rgba(0,0,0,.45);border:2px solid rgba(255,235,200,.5)}
.title-act{font-size:24px;letter-spacing:3px;color:#e2c179;margin-bottom:34px}
.sample-badge{display:inline-block;background:var(--gold);color:#3a2c10;font-size:17px;padding:2px 12px;border-radius:12px;margin-left:10px;letter-spacing:2px;vertical-align:3px}
#btnStart,#btnContinue{display:block;margin:0 auto 14px;padding:13px 58px;font-size:26px;letter-spacing:8px;cursor:pointer;font-family:inherit;
  background:linear-gradient(180deg,var(--red),var(--red2));color:#fdf3dd;border:2px solid var(--gold2);border-radius:40px;
  box-shadow:0 8px 20px rgba(120,30,15,.45);transition:transform .2s ease}
#btnStart:hover,#btnContinue:hover{transform:translateY(-3px) scale(1.03)}
#btnStart:disabled{opacity:.55;cursor:wait;transform:none}
#btnContinue{padding:10px 44px;font-size:21px;letter-spacing:4px}
#btnContinue.hidden{display:none}
.credit{margin-top:26px;font-size:15px;color:rgba(226,193,121,.75);letter-spacing:1px}

/* ---------- 结尾 ---------- */
#endCard{position:absolute;inset:0;z-index:70;background:linear-gradient(180deg,rgba(13,22,28,.55),rgba(13,22,28,.78));display:flex;align-items:center;justify-content:center}
#endCard.hidden{display:none}
.end-scroll{width:640px;max-width:90%;background:linear-gradient(178deg,#fbf4df,#efe0ba);border-radius:8px;padding:44px 48px 34px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.55);position:relative}
.end-scroll::before,.end-scroll::after{content:"";position:absolute;left:0;right:0;height:14px;background:repeating-linear-gradient(90deg,#8a5a28 0 26px,#a06c33 26px 52px);border-radius:4px}
.end-scroll::before{top:-8px}.end-scroll::after{bottom:-8px}
.end-title{font-size:44px;color:var(--red2);letter-spacing:8px;margin-bottom:16px}
.end-notes{font-size:21px;color:#7a6a45;margin-bottom:10px}
.end-sample{font-size:21px;line-height:1.8;color:#4a3d28;margin-bottom:8px}
.end-tip{font-size:18px;color:#96844f;margin:14px 0 20px;line-height:1.7}
#btnReplay{padding:11px 46px;font-size:22px;letter-spacing:5px;background:linear-gradient(180deg,var(--red),var(--red2));color:#fdf3dd;
  border:2px solid var(--gold2);border-radius:32px;cursor:pointer;font-family:inherit}
#btnReplay:hover{filter:brightness(1.08)}

/* ---------- 特效与提示 ---------- */
.fxtxt{position:absolute;font-size:34px;color:rgba(244,233,207,.92);letter-spacing:6px;text-shadow:0 2px 10px rgba(0,0,0,.5);z-index:45;pointer-events:none;animation:fxFloat 2.2s ease-out forwards}
@keyframes fxFloat{0%{opacity:0;transform:translate(0,0) rotate(-4deg)}12%{opacity:1}100%{opacity:0;transform:translate(140px,-60px) rotate(6deg)}}
.spark{position:absolute;color:#ffe9a8;z-index:46;pointer-events:none;animation:sparkUp 1.1s ease-out forwards}
@keyframes sparkUp{0%{opacity:0;transform:translateY(0) scale(.5)}25%{opacity:1}100%{opacity:0;transform:translateY(-90px) scale(1.25)}}
#toast{position:absolute;top:76px;left:50%;transform:translateX(-50%);background:rgba(38,38,46,.88);color:#f4e9cf;padding:9px 22px;
  border-radius:22px;font-size:19px;border:1px solid rgba(226,193,121,.5);z-index:65;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}

/* ---------- 幕间卡 ---------- */
#interlude{position:absolute;inset:0;z-index:75;background:linear-gradient(180deg,rgba(13,22,28,.72),rgba(13,22,28,.85));display:flex;align-items:center;justify-content:center}
#interlude.hidden{display:none}
.inter-card{text-align:center;color:#f4e9cf}
.inter-act{font-size:46px;letter-spacing:10px;color:#f7ecd2;text-shadow:0 4px 16px rgba(0,0,0,.5);margin-bottom:18px}
.inter-sub{font-size:22px;color:#cdb98a;margin-bottom:30px;letter-spacing:2px}
#interGo{padding:11px 46px;font-size:21px;letter-spacing:6px;background:linear-gradient(180deg,var(--red),var(--red2));color:#fdf3dd;border:2px solid var(--gold2);border-radius:30px;cursor:pointer;font-family:inherit}
/* ---------- 弹幕 ---------- */
.danmu{position:absolute;left:0;white-space:nowrap;font-size:20px;color:#fdf3dd;background:rgba(160,40,30,.8);padding:6px 16px;border-radius:18px;border:1px solid rgba(226,193,121,.55);z-index:44;pointer-events:none;animation:danmuMove linear forwards}
@keyframes danmuMove{from{transform:translateX(1320px)}to{transform:translateX(-480px)}}
/* ---------- 接绣球 / 听胎心 / 拜堂 ---------- */
#basket{position:absolute;width:130px;z-index:38;pointer-events:none}
#xiuqiuBall{position:absolute;width:64px;z-index:37;pointer-events:none}
#heartCore{position:absolute;left:50%;top:44%;width:120px;height:120px;margin-left:-60px;margin-top:-60px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%, #ff8d7e, #c0392b 62%, #8f2418);
  box-shadow:0 0 34px rgba(220,80,60,.65);z-index:37;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#fff3d9;font-size:24px;letter-spacing:2px}
#heartCount{position:absolute;top:150px;left:50%;transform:translateX(-50%);color:#f4e9cf;font-size:20px;z-index:38}
#bigTap{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:54px;letter-spacing:8px;color:#ffe9a8;text-shadow:0 6px 18px rgba(120,20,10,.6);z-index:38;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap}
/* ---------- 取名 ---------- */
#nameModal .paper{width:520px;max-width:88%;background:linear-gradient(175deg,#fbf4df,#f1e3bf);border-radius:10px;padding:34px 40px;box-shadow:0 18px 50px rgba(0,0,0,.5);text-align:center}
#nameModal h3{color:var(--red2);font-size:26px;letter-spacing:3px;margin-bottom:14px}
#babyInput{width:100%;padding:12px 18px;font-size:24px;font-family:inherit;text-align:center;color:#4a3d28;background:#fffbe9;border:2px solid var(--gold);border-radius:12px;outline:none}
#nameHint{font-size:17px;color:#8a7c5c;margin:12px 0 18px;line-height:1.6}
#nameOk{padding:10px 40px;font-size:21px;letter-spacing:4px;background:linear-gradient(180deg,var(--red),var(--red2));color:#fdf3dd;border:1.5px solid var(--gold2);border-radius:24px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <img id="bgA" class="bg" alt="">
    <img id="bgB" class="bg" alt="">
    <canvas id="snow" width="1280" height="720"></canvas>
    <div id="char-tt" class="char sideL"><img alt="天天"></div>
    <div id="char-rr" class="char sideR"><img alt="瑞瑞"></div>
    <div id="fxLayer"></div>

    <div id="gameLayer" class="hidden">
      <div id="gameBanner">帮瑞瑞把三盏小灯笼拖回摊上的挂钩区吧！</div>
      <div id="incenseWrap"><span>一炷香</span><div id="incenseBar"><div id="incenseFill"></div></div></div>
      <div id="targetZone">挂 灯 区</div>
      <div id="bigTap"></div>
    </div>

    <div id="hud" class="hidden">
      <button id="hudTitle">瑞雪遇晴天</button>
      <div class="hud-right">
        <button id="btnNotes" class="hudBtn" title="科学小纸条">纸<span id="noteCount" class="badge">0</span></button>
        <button id="btnMute" class="hudBtn" title="音乐开关">♫</button>
      </div>
    </div>

    <div id="dlg" class="hidden">
      <div id="dlgName" class="hidden"></div>
      <div id="dlgText"></div>
      <div id="dlgNext" class="hidden">▼</div>
    </div>
    <div id="choices" class="hidden"></div>

    <div id="noteModal" class="overlay hidden">
      <div id="notePaper">
        <div id="noteTitle"></div>
        <div id="noteBody"></div>
        <button id="noteClose">收 好 啦</button>
      </div>
    </div>

    <div id="listModal" class="overlay hidden">
      <div id="listPaper">
        <h3>科学小纸条 · 收藏夹</h3>
        <div id="listBody"></div>
        <button id="listClose">关 闭</button>
      </div>
    </div>

    <div id="interlude" class="hidden">
      <div class="inter-card">
        <div class="inter-act" id="interTitle"></div>
        <div class="inter-sub" id="interSub"></div>
        <button id="interGo">继 续</button>
      </div>
    </div>

    <div id="nameModal" class="overlay hidden">
      <div class="paper">
        <h3>给小星星取个名字</h3>
        <input id="babyInput" maxlength="8" placeholder="写在这里">
        <div id="nameHint">留空的话，就叫他「小满」吧——<br>节气里最有盼头的名字。</div>
        <button id="nameOk">取 好 了</button>
      </div>
    </div>

    <div id="endCard" class="hidden">
      <div class="end-scroll">
        <div class="end-title" id="endTitle">全剧 · 完</div>
        <div class="end-notes" id="endNotes"></div>
        <div class="end-sample" id="endSample"></div>
        <div class="end-tip">想改哪里（人物 / 台词 / 玩法 / 音乐），<br>或者想加新剧情新彩蛋——这个小剧场还能继续加戏～</div>
        <button id="btnReplay">再 看一 遍</button>
      </div>
    </div>

    <div id="toast"></div>

    <div id="title">
      <div class="title-card">
        <div class="title-sub">国 风 互 动 小 剧 场</div>
        <div class="title-main"><div class="seal">缘</div><h1>瑞雪遇晴天</h1><div class="seal" style="transform:rotate(-6deg)">雪</div></div>
        <div class="title-act">相遇 · 相爱 · 结婚 · 生娃</div>
        <button id="btnStart" disabled>正在铺开画卷…</button>
        <button id="btnContinue" class="hidden">继续上次</button>
        <div class="credit">插画为 AI 生成 · 音乐由 WebAudio 实时合成 · 点击画面推进对话</div>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';
/* ================= 素材（由脚本注入 base64） ================= */
const ASSETS = {
  bg_fair:     '{{BG_FAIR}}',
  bg_stall:    '{{BG_STALL}}',
  bg_spring:   '{{BG_SPRING}}',
  bg_noodle:   '{{BG_NOODLE}}',
  bg_wstreet:  '{{BG_WSTREET}}',
  bg_whall:    '{{BG_WHALL}}',
  bg_bedroom:  '{{BG_BEDROOM}}',
  bg_starry:   '{{BG_STARRY}}',
  bg_family:   '{{BG_FAMILY}}',
  tt_normal:   '{{TT_NORMAL}}',

    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(dest||this.melodyGain); o.start(t); o.stop(t+dur+0.05);
  },
  schedule(){
    if(!this.ctx) return;
    while(this.nextT < this.ctx.currentTime + 0.35){
      const n = this.motif[this.step % this.motif.length];
      const rest = Math.random()<0.14;
      if(!rest){
        const f = this.PENTA[n];
        this.pluck(f, this.nextT, 1.25, 0.11);
        if(this.step%4===0) this.pluck(f*0.5, this.nextT, 1.5, 0.05);
      }
      this.step++;
      this.nextT += this.tempo;
    }
  },
  sfx(kind){
    if(!this.ctx) return;
    const t=this.ctx.currentTime;
    if(kind==='pop'){ this.pluck(880,t,0.4,0.12,this.master); }
    if(kind==='click'){ this.pluck(659.25,t,0.25,0.08,this.master); }
    if(kind==='chime'){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>this.pluck(f,t+i*0.09,0.7,0.1,this.master)); }
    if(kind==='gong'){
      const o=this.ctx.createOscillator(), g=this.ctx.createGain(), o2=this.ctx.createOscillator();
      o.type='sine'; o.frequency.value=180; o2.type='sine'; o2.frequency.value=181.7;
      g.gain.setValueAtTime(0.16,t); g.gain.exponentialRampToValueAtTime(0.0001,t+2.2);
      o.connect(g); o2.connect(g); g.connect(this.master);
      o.start(t); o2.start(t); o.stop(t+2.3); o2.stop(t+2.3);
    }
    if(kind==='plop'){ this.pluck(220,t,0.3,0.14,this.master); }
  }
};

/* ================= 雪花 ================= */
const Snow = {
  c:$('snow'), parts:[], level:2, gust:0, running:false,
  set(level){
    this.level=level;
    const target = level===2?85 : level===1?46 : 0;
    while(this.parts.length<target) this.parts.push(this.make(true));
    if(this.parts.length>target) this.parts.length=target;
    if(!this.running){ this.running=true; requestAnimationFrame(()=>this.tick()); }
  },
  make(anyY){ return {x:Math.random()*1280, y:anyY?Math.random()*720:-10, r:0.9+Math.random()*2.3, s:0.55+Math.random()*1.25, ph:Math.random()*6.28, sw:0.3+Math.random()*0.9, o:0.35+Math.random()*0.5}; },
  tick(){
    const ctx=this.c.getContext('2d');
    ctx.clearRect(0,0,1280,720);
    if(this.gust>0) this.gust-=0.012;
    for(const p of this.parts){
      p.ph+=0.012;
      p.x += Math.sin(p.ph)*p.sw + this.gust*(1.5+p.r);
      p.y += p.s*(1+p.r*0.22);
      if(p.y>730){ Object.assign(p, this.make(false)); }
      if(p.x>1290) p.x=-10; if(p.x<-10) p.x=1290;
      ctx.globalAlpha=p.o; ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.29); ctx.fill();
    }
    ctx.globalAlpha=1;
    if(this.parts.length>0) requestAnimationFrame(()=>this.tick()); else this.running=false;
  }
};

    if(this.count) this.count.remove();
    AudioSys.sfx('chime');
    setTimeout(()=>{ layer.classList.add('hidden'); hud.classList.remove('hidden'); const r=this.resolve; this.resolve=null; r&&r(); }, 700);
  }
};

/* ================= 拜堂三连点 ================= */
const TapsBeat={
  active:false, lines:[], idx:0, resolve:null, handler:null,
  run(lines){
    return new Promise(r=>{
      this.lines=lines; this.idx=0; this.resolve=r; this.active=true;
      const layer=$('gameLayer'); layer.classList.remove('hidden');
      $('gameBanner').textContent='跟着司仪，点击行礼';
      $('targetZone').style.display='none';
      hud.classList.add('hidden');
      this.show(0);
      this.handler=(e)=>{ if(!this.active) return; e.preventDefault(); e.stopPropagation(); this.next(); };
      layer.addEventListener('pointerdown', this.handler);
    });
  },
  show(i){ const el=$('bigTap'); el.textContent=this.lines[i]; el.style.opacity=1; AudioSys.sfx('gong'); },
  next(){
    this.idx++;
    if(this.idx < this.lines.length){ this.show(this.idx); }
    else{ $('bigTap').style.opacity=0; setTimeout(()=>this.finish(), 700); }
  },
  finish(){
    this.active=false;
    $('gameLayer').removeEventListener('pointerdown', this.handler);
    $('gameLayer').classList.add('hidden');
    hud.classList.remove('hidden');
    AudioSys.sfx('chime');
    const r=this.resolve; this.resolve=null; r&&r();
  }
};

/* ================= 取名 ================= */
const NameFlow={
  run(){
    return new Promise(r=>{
      hideDlg();
      $('babyInput').value='';
      $('nameModal').classList.remove('hidden');
      setTimeout(()=>{ try{ $('babyInput').focus(); }catch(e){} }, 350);
      $('nameOk').onclick=()=>{
        let v=$('babyInput').value.trim().slice(0,8);
        if(!v) v='小满';
        Save.data.baby=v; Save.write();
        $('nameModal').classList.add('hidden');
        AudioSys.sfx('chime');
        const hasT=v.includes('天'), hasR=v.includes('瑞');
        if(hasT&&hasR) toast('把爸爸妈妈都写进名字里啦！');
        else if(hasT) toast('跟爸爸共用一个字！');
        else if(hasR) toast('跟妈妈共用一个字！');
        setTimeout(()=>{ r(); }, 1000);
      };
    });
  }
};

function runGame(b){
  const kind=b.kind||'lantern';
  if(kind==='lantern') return MiniGame.run(b.label);
  if(kind==='xiuqiu') return BasketGame.run(b.label);
  return HeartGame.run(b.label);
}

/* ================= 引擎主循环 ================= */
const Engine = {
  i:0, running:false,
  async start(from){
    this.i=from; this.running=true;
    hud.classList.remove('hidden');
    await this.loop();
  },
  async loop(){
    while(this.running && this.i<SCRIPT.length){
      const b=SCRIPT[this.i];
      this.i++;
      Save.data.i=this.i; Save.write();
      await this.beat(b);
    }
  },
  beat(b){
    return new Promise(async res=>{
      switch(b.t){
        case 'bg':
          setBg(b.key); if(b.snow!=null) Snow.set(b.snow);
          AudioSys.sfx('gong');
          setTimeout(res, 900);
          break;
        case 'show':
          showChar(b.who, b.look);
          setTimeout(res, 650);
          break;
        case 'look':
          setLook(b.who, b.look);
          res();
          break;
        case 'hide':
          hideChar(b.who); res();
          break;
        case 'fx':
          if(b.kind==='wind'){
            Snow.gust=1.6;
            stage.classList.remove('shake'); stage.classList.add('shake');
            fxText('呼——————');
            AudioSys.sfx('gong');
            setTimeout(()=>stage.classList.remove('shake'), 520);
            setTimeout(res, 1400);
          }else if(b.kind==='sparkle'){
            const r=CHARS.rr.getBoundingClientRect(), sr=stage.getBoundingClientRect();
            fxSparkle((r.left-sr.left)/sr.width*1280, (r.top-sr.top)/sr.height*720, 16);
            AudioSys.sfx('chime');
            setTimeout(res, 1100);
          }else res();
          break;
        case 'say': {
          showDlg();
          if(b.who==='nar'){ dlgName.classList.add('hidden'); dlgText.classList.add('nar'); }
          else{
            dlgName.classList.remove('hidden'); dlgName.textContent=WHO_NAME[b.who]||'';
            dlgText.classList.remove('nar');
            if(b.look) setLook(b.who, b.look);
            talkBounce(b.who);
          }
          const sayText=String(b.text||'').split('{{baby}}').join(Save.data.baby||'小满');
          await new Promise(r=>typewrite(sayText, r));
          allowAdvance=true; dlgNext.classList.remove('hidden');
          await new Promise(r=>{ advanceRes=r; });
          res();
          break;
        }
        case 'choice': {
          hideDlg();
          choicesEl.innerHTML='';
          const p=document.createElement('div'); p.id='choicePrompt'; p.textContent=b.prompt;
          choicesEl.appendChild(p);
          b.options.forEach(op=>{
            const c=document.createElement('button'); c.className='choice'; c.textContent=op.label;
            c.onclick=async ()=>{
              AudioSys.sfx('click');
              choicesEl.classList.add('hidden');
              for(const rb of op.reply){ await this.beat(rb); }
              res();
            };
            choicesEl.appendChild(c);
          });
          choicesEl.classList.remove('hidden');
          break;
        }
        case 'note':
          hideDlg();
          await collectNote(b.id);
          res();
          break;
        case 'game':
          hideDlg();
          await runGame(b);
          res();
          break;
        case 'music':
          AudioSys.setMode(b.mode);
          res();
          break;
        case 'danmu':
          hideDlg();
          spawnDanmu(b.items||[]);
          setTimeout(res, 3600+(b.items||[]).length*650);
          break;
        case 'interlude':
          hideDlg();
          $('interTitle').textContent=b.title||'';
          $('interSub').textContent=b.sub||'';
          $('interlude').classList.remove('hidden');
          AudioSys.sfx('gong');
          $('interGo').onclick=()=>{ $('interlude').classList.add('hidden'); AudioSys.sfx('click'); res(); };
          break;
        case 'taps':
          hideDlg();
          TapsBeat.run(b.lines||[]).then(res);
          break;
        case 'name':
          NameFlow.run().then(res);
          break;
        case 'end':
          hideDlg();
          const cnt=Save.data.notes.length;
          Save.resetProgress();
          $('endTitle').textContent=b.title||'全剧 · 完';
          $('endSample').innerHTML=(b.line? b.line+'<br>':'')+(Save.data.baby? ('小星星的名字，叫作「'+Save.data.baby+'」。'):'');
          $('endNotes').textContent='科学小纸条：'+cnt+' / 6 已收藏';
          $('endCard').classList.remove('hidden');
          AudioSys.sfx('chime');
          this.running=false;
          res();
          break;
        default: res();
      }
    });
  }
};
let advanceRes=null;

/* 点击推进 */
stage.addEventListener('pointerdown', e=>{
  if(e.target.closest('#hud,#noteModal,#listModal,#nameModal,#interlude,#endCard,#gameLayer,#choices,#title')) return;
  if(typing){ finishType(); return; }
  if(allowAdvance && advanceRes){ allowAdvance=false; dlgNext.classList.add('hidden'); const r=advanceRes; advanceRes=null; r(); }
});

/* ================= 立绘重建（继续上次） ================= */
function rebuild(i){
  curBg=null; bgA.classList.remove('on'); bgB.classList.remove('on');
  CHARS.tt.classList.remove('on'); CHARS.rr.classList.remove('on');
  for(let j=0;j<i && j<SCRIPT.length;j++){
    const b=SCRIPT[j];
    if(b.t==='bg'){ setBg(b.key,true); if(b.snow!=null) Snow.set(b.snow); }
    else if(b.t==='show') showChar(b.who,b.look,true);
    else if(b.t==='look') setLook(b.who,b.look);
    else if(b.t==='hide') hideChar(b.who);
  }
}

/* ================= 启动 ================= */
function fit(){
  const s=Math.min(window.innerWidth/1280, window.innerHeight/720);
  stage.style.setProperty('--s','scale('+s+')');
  stage.style.transform='scale('+s+')';
}
window.addEventListener('resize', fit); fit();

async function preload(){
  const jobs=Object.values(ASSETS).map(src=>{
    const im=new Image(); im.src=src; return im.decode().catch(()=>{});
  });
  await Promise.all(jobs);
}
function bindMute(){
  $('btnMute').classList.toggle('muted', AudioSys.muted);
  $('btnMute').onclick=()=>{
    AudioSys.setMuted(!AudioSys.muted);
    Save.data.muted=AudioSys.muted; Save.write();
    $('btnMute').classList.toggle('muted', AudioSys.muted);
    if(!AudioSys.muted) AudioSys.sfx('click');
  };
}

(async function boot(){
  Save.load();
  AudioSys.muted=!!Save.data.muted;
  bindMute();
  $('noteCount').textContent=Save.data.notes.length;
  await preload();
  Snow.set(2);
  const canResume = Save.data.i>0 && Save.data.i<SCRIPT.length && Save.data.notes.length>=0 && Save.data.i<SCRIPT.length-1;
  if(canResume) $('btnContinue').classList.remove('hidden');
  const begin=(from)=>{
    $('title').classList.add('hidden');
    AudioSys.init(); AudioSys.setMuted(AudioSys.muted);
    if(from>0) rebuild(from);
    Engine.start(from);
  };
  $('btnStart').onclick=()=>{ Save.clear(); begin(0); };
  $('btnContinue').onclick=()=>{ begin(Save.data.i); };
  $('btnStart').disabled=false; $('btnStart').textContent='开  幕';
  $('btnReplay').onclick=()=>{
    $('endCard').classList.add('hidden');
    Save.resetProgress();
    $('noteCount').textContent=Save.data.notes.length;
    begin(0);
  };
})();
</script>
